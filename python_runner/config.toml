# Persistent default robot configuration.
# Edit these so the interactive prompts default to your usual setup;
# press Enter at each prompt to accept the value here.

com_port = "COM4"
num_shelves = 4
photos_per_shelf = 8
cycle_interval_min = 15
day_hours = 24            # 24 = constant light
start_hour = 0
image_dir = 'C:\Users\zhu.lab\Desktop\robotic_imaging'
kill_margin_min = 2       # grace added to the cycle interval before a kill

# In-process camera capture (PySpin). If true, the host grabs each hardware-
# triggered frame and saves a JPG into the run folder itself. If that can't run
# as configured (SpinView open, PySpin or camera missing, User Set won't load),
# the host refuses to start. Run it from pyspin-env (PySpin + pyserial + tomli).
# Set false to capture with SpinView/FlyCap deliberately.
use_internal_capture = true
camera_user_set = "UserSet1"  # camera User Set loaded at start; a failed load refuses the run ("" = leave as-is)
